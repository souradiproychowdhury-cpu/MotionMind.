<style>
    @layer base {
      html, body {
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #050811;
        overflow-x: hidden;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 16px); }
    }
    ::-webkit-scrollbar { display: none; }

    /* Sci-Fi Glow & HUD effects */
    .glow-cyan {
      filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.75)) drop-shadow(0 0 16px rgba(0, 240, 255, 0.35));
    }
    .glow-cyan-lg {
      filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.9)) drop-shadow(0 0 30px rgba(0, 240, 255, 0.5));
    }
    .text-glow {
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.4);
    }
    .box-glow {
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.15);
    }

    /* Keyframe Animations */
    @keyframes pulseArcs {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.985); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes radarCounterSweep {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes wavePulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    .anim-pulse-arcs {
      animation: pulseArcs 2.8s ease-in-out infinite;
      transform-origin: center center;
    }
    .anim-spin-slow {
      animation: radarSweep 24s linear infinite;
      transform-origin: center center;
    }
    .anim-spin-reverse {
      animation: radarCounterSweep 32s linear infinite;
      transform-origin: center center;
    }
    .anim-wave-1 { animation: wavePulse 1.8s ease-in-out infinite; }
    .anim-wave-2 { animation: wavePulse 1.8s ease-in-out infinite 0.3s; }
    .anim-wave-3 { animation: wavePulse 1.8s ease-in-out infinite 0.6s; }

    /* Sci-fi circuit background */
    .circuit-grid {
      background-image: 
        radial-gradient(circle at 50% 40%, rgba(0, 240, 255, 0.12) 0%, rgba(6, 17, 36, 0.4) 45%, transparent 75%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
    }
  </style>
</head>

</span>

<!-- Bottom Mini Terminal Coordinates -->
<footer class="w-full pb-safe px-5 py-2.5 z-20 flex items-center justify-between text-[10px] font-mono text-[#4f687a] border-t border-[#00f0ff]/10 bg-[#050811]/70 backdrop-blur-sm">
<div class="flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-[#00f0ff]/70"></span>
<span>HOLO-HUD • MATRIX v2.4</span>
</div>
<div class="tracking-widest">FPS: 60 • LATENCY: 0ms</div>
</footer>
<!-- Interactive 1% to 100% Sequence & Dashboard Transition Script -->
<script>
    (function() {
      // Elements
      const getStartedBtn = document.getElementById('btn-get-started');
      const btnLabel = document.getElementById('btn-label');
      const percentageEl = document.getElementById('hud-percentage');
      const loadingLabel = document.getElementById('hud-loading-label');
      const subLogEl = document.getElementById('hud-sub-log');
      const circleProgress = document.getElementById('countdown-circle-progress');
      const sysModeTag = document.getElementById('sys-mode-tag');
      const posX = document.getElementById('pos-x');
      const posY = document.getElementById('pos-y');
      const telemReticle = document.getElementById('telem-reticle');
      const telemCarrier = document.getElementById('telem-carrier');
      const hudContainer = document.getElementById('hud-container');

      let isCalibrating = false;
      let calibrationCompleted = false;

      // Random jitter for telemetry
      setInterval(() => {
        if (!isCalibrating && !calibrationCompleted) {
          const rx = (120 + Math.random() * 8).toFixed(2);
          const ry = (-40 - Math.random() * 5).toFixed(2);
          posX.textContent = `+${rx}`;
          posY.textContent = `${ry}`;
        }
      }, 700);

      // Calibration Stages mapping
      const stages = [
        { threshold: 1, text: "INITIALIZING...", log: "ESTABLISHING NEURAL CARRIER" },
        { threshold: 18, text: "SCANNING RADAR...", log: "OPTICAL FREQUENCY ALIGNMENT" },
        { threshold: 30, text: "loading...", log: "MAPPING DEPTH POINT CLOUD" },
        { threshold: 52, text: "SENSORS LOCKING...", log: "CALIBRATING 3D RETICLE" },
        { threshold: 76, text: "GESTURE ENGINE...", log: "ACTIVATING HOLOGRAPHIC PIPELINE" },
        { threshold: 92, text: "SYNCING MATRIX...", log: "FINE TUNING SUB-MILLIMETER TRACKING" },
        { threshold: 100, text: "READY", log: "CALIBRATION COMPLETE • SPATIAL ENGINE READY" }
      ];

      function triggerCalibrationSequence() {
        if (isCalibrating) return;

        if (calibrationCompleted) {
          // Reset if pressed again to let user experience loop
          calibrationCompleted = false;
        }

        isCalibrating = true;
        sysModeTag.textContent = "CALIBRATION ACTIVE";
        sysModeTag.classList.remove('text-[#dbfcff]');
        sysModeTag.classList.add('text-[#fed639]');
        telemReticle.textContent = "LOCKING...";
        telemReticle.className = "text-[11px] font-mono text-[#fed639] font-semibold animate-pulse";
        btnLabel.textContent = "Calibrating Sensors...";
        getStartedBtn.classList.add('opacity-90', 'pointer-events-none');

        let currentPercent = 1;
        const totalCircumference = 691; // 2 * PI * 110

        const interval = setInterval(() => {
          // Speed increments dynamically
          let step = 1;
          if (currentPercent < 25) step = 1;
          else if (currentPercent < 60) step = 2;
          else if (currentPercent < 85) step = 1;
          else step = 2;

          currentPercent += step;

          if (currentPercent >= 100) {
            currentPercent = 100;
            clearInterval(interval);
            finishCalibration();
          }

          // Update Display
          percentageEl.textContent = currentPercent.toString().padStart(2, '0');
          
          // SVG Dashoffset calculation
          const offset = totalCircumference - (currentPercent / 100) * totalCircumference;
          circleProgress.style.strokeDashoffset = offset;

          // Update Status Readouts matching Image 2
          for (let i = stages.length - 1; i >= 0; i--) {
            if (currentPercent >= stages[i].threshold) {
              loadingLabel.textContent = stages[i].text;
              subLogEl.textContent = stages[i].log;
              break;
            }
          }

          // Dynamic Jitter Coordinates during calibration
          const jX = (100 + (currentPercent * 0.4) + Math.random() * 4).toFixed(2);
          const jY = (-20 - (currentPercent * 0.25) + Math.random() * 4).toFixed(2);
          posX.textContent = `+${jX}`;
          posY.textContent = `${jY}`;
          telemCarrier.textContent = `${(240 + currentPercent * 0.85).toFixed(1)} MHz`;

        }, 38);
      }

      function finishCalibration() {
        isCalibrating = false;
        calibrationCompleted = true;

        percentageEl.textContent = "100";
        loadingLabel.textContent = "ACTIVE";
        subLogEl.innerHTML = "<span class='text-[#7df4ff] font-bold'>CALIBRATION COMPLETE • SPATIAL ENGINE READY</span>";
        
        sysModeTag.textContent = "ENGINE ONLINE";
        sysModeTag.className = "text-[#00f0ff] font-bold";
        telemReticle.textContent = "LOCKED";
        telemReticle.className = "text-[11px] font-mono text-[#00f0ff] font-bold";

        // Transition HUD visual state to full live interactive mode
        hudContainer.classList.add('scale-[1.03]', 'transition-transform', 'duration-500');
        getStartedBtn.classList.remove('pointer-events-none');
        btnLabel.textContent = "System Ready • Tap to Re-Calibrate";
        getStartedBtn.classList.replace('from-[#00f0ff]', 'from-[#00e575]');
        getStartedBtn.classList.replace('to-[#0066cc]', 'to-[#009b8d]');

        // Interactive touch/mouse reticle tracker in completed state
        hudContainer.addEventListener('mousemove', handleReticleTrack);
        hudContainer.addEventListener('touchmove', handleTouchTrack, { passive: true });
      }

      function handleReticleTrack(e) {
        const rect = hudContainer.getBoundingClientRect();
        const nx = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
        const ny = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
        posX.textContent = `${nx >= 0 ? '+' : ''}${(nx * 140).toFixed(2)}`;
        posY.textContent = `${ny >= 0 ? '+' : ''}${(ny * 140).toFixed(2)}`;
      }

      function handleTouchTrack(e) {
        if (!e.touches[0]) return;
        const rect = hudContainer.getBoundingClientRect();
        const nx = ((e.touches[0].clientX - rect.left) / rect.width - 0.5) * 2;
        const ny = ((e.touches[0].clientY - rect.top) / rect.height - 0.5) * 2;
        posX.textContent = `${nx >= 0 ? '+' : ''}${(nx * 140).toFixed(2)}`;
        posY.textContent = `${ny >= 0 ? '+' : ''}${(ny * 140).toFixed(2)}`;
      }

      // Action listener
      getStartedBtn.addEventListener('click', triggerCalibrationSequence);

    })();
  </script>
</body></html>
